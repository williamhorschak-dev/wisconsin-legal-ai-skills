name: Technical issue or general correction
description: Report a software defect, general documentation correction, or feature suggestion.
body:
  - type: markdown
    attributes:
      value: |
        This is a **public technical support channel**, not legal intake.
        William Horschak is not a licensed attorney and does not provide individual
        legal advice through this project. Do not post case files, personal details,
        privileged material, or requests for advice about your matter.
        Read the [legal notice](https://github.com/williamhorschak-dev/wisconsin-legal-ai-skills/blob/main/LEGAL_NOTICE.md).
  - type: checkboxes
    id: scope
    attributes:
      label: Scope and privacy
      options:
        - label: This concerns software, general documentation, or a feature; I am not requesting advice about an individual matter.
          required: true
        - label: I have used fictional examples and excluded confidential information, case files, and personal identifying details.
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of report
      options:
        - Software defect
        - General documentation correction
        - Feature suggestion
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected skill or area
      options:
        - cite-check
        - wisconsin-legal-writing
        - wisconsin-legal-interpretation
        - Prompt exports (prompt-packs.zip)
        - Evaluation suite
        - README or other documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release version
      description: The version in the VERSION file or the release tag, for example 2026.10.13.1.
      placeholder: "2026.10.24.1"
  - type: input
    id: environment
    attributes:
      label: Host, operating system, and Python version (if relevant)
      description: For example, Claude Code on Windows with Python 3.12. Leave blank for a documentation correction.
  - type: textarea
    id: description
    attributes:
      label: Technical issue or general correction
      description: Identify the affected file and line. For a general legal-reference correction, give the official public source link, the date you read it, and the effective date of the text, including any effective-date note on the page.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps or proposed change
      description: Use synthetic inputs. Include host and version information when relevant, but no credentials or private case material.
