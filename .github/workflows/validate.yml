name: Validate skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/skill_tools.py validate
      - run: python scripts/evaluate.py validate
      - run: python scripts/trigger_eval.py validate
      - run: python scripts/source_registry.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py --out dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-09-20
        with:
          name: release-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
